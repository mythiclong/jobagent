server.port=${JOBAGENT_SERVER_PORT:1005}

jobagent.demo.admin-username=admin
jobagent.demo.admin-password=123456
jobagent.demo.admin-display-name=\u7cfb\u7edf\u7ba1\u7406\u5458
jobagent.demo.admin-email=admin@example.com
jobagent.demo.user-username=demo
jobagent.demo.user-password=123456
jobagent.demo.user-display-name=\u6f14\u793a\u6c42\u804c\u8005
jobagent.demo.user-email=demo@example.com
jobagent.demo.seed-demo-profile=true

spring.datasource.url=jdbc:h2:file:./data/jobagent;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# AI provider config (env-first; keep property keys empty in normal use)
# Gemini env key: GEMINI_API_KEY
jobagent.ai.gemini.enabled=true
jobagent.ai.gemini.api-key=
jobagent.ai.gemini.model=gemini-2.5-flash
jobagent.ai.gemini.timeout-seconds=30

# Qwen env key: DASHSCOPE_API_KEY (compatible: QWEN_API_KEY)
jobagent.ai.qwen.enabled=true
jobagent.ai.qwen.api-key=
jobagent.ai.qwen.model=qwen3.5-plus
jobagent.ai.qwen.timeout-seconds=60
jobagent.ai.qwen.endpoint=https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
jobagent.ai.question-title-translation.enabled=true
jobagent.ai.question-title-translation.batch-size=12

# Update center schedule (reserved, default off)
jobagent.update-center.schedule-enabled=false
jobagent.update-center.schedule-cron=0 0 3 * * *
jobagent.update-center.fetch-timeout-seconds=20

# Public job source adapters
jobagent.update.jobs.campus.enabled=true
jobagent.update.jobs.campus.source-name=CAMPUS_JOB_SITE
jobagent.update.jobs.campus.urls=https://job.henu.edu.cn/
jobagent.update.jobs.public.enabled=false
jobagent.update.jobs.public.source-name=PUBLIC_RECRUIT_SOURCE
jobagent.update.jobs.public.urls=
jobagent.update.jobs.guangdong.enabled=false
jobagent.update.jobs.guangdong.source-name=GD_PUBLIC_JOB
jobagent.update.jobs.guangdong.urls=
jobagent.update.jobs.company.enabled=false
jobagent.update.jobs.company.source-name=COMPANY_CAREER_SITE
jobagent.update.jobs.company.urls=

# Interview question source adapters
jobagent.update.questions.github.enabled=true
jobagent.update.questions.github.source-name=GITHUB_PUBLIC_REPO
jobagent.update.questions.github.repos=sudheerj/javascript-interview-questions,sudheerj/reactjs-interview-questions,arialdomartini/Back-End-Developer-Interview-Questions,yangshun/tech-interview-handbook
jobagent.update.questions.public.enabled=false
jobagent.update.questions.public.source-name=PUBLIC_INTERVIEW_ARTICLE
jobagent.update.questions.public.urls=

# Learning resource source adapters
jobagent.update.resources.spring.enabled=true
jobagent.update.resources.spring.source-name=SPRING_GUIDES
jobagent.update.resources.spring.url=https://spring.io/guides
jobagent.update.resources.mdn.enabled=true
jobagent.update.resources.mdn.source-name=MDN_LEARN
jobagent.update.resources.mdn.url=https://developer.mozilla.org/en-US/docs/Learn_web_development
jobagent.update.resources.microsoft.enabled=false
jobagent.update.resources.microsoft.source-name=MICROSOFT_LEARN
jobagent.update.resources.microsoft.url=https://learn.microsoft.com/en-us/training/browse/
jobagent.update.resources.freecodecamp.enabled=false
jobagent.update.resources.freecodecamp.source-name=FREECODECAMP
jobagent.update.resources.freecodecamp.url=https://www.freecodecamp.org/news/tag/javascript/
jobagent.update.resources.runoob.enabled=true
jobagent.update.resources.runoob.source-name=RUNOOB
jobagent.update.resources.runoob.url=https://www.runoob.com/
jobagent.update.resources.liaoxuefeng.enabled=true
jobagent.update.resources.liaoxuefeng.source-name=LIAOXUEFENG
jobagent.update.resources.liaoxuefeng.url=https://www.liaoxuefeng.com/
jobagent.update.resources.blog-whitelist.enabled=false
jobagent.update.resources.blog-whitelist.source-name=BLOG_WHITELIST
jobagent.update.resources.blog-whitelist.urls=
